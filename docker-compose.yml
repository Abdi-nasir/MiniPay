services:
  payment_db:
    image: postgres:17-alpine
    container_name: minipay-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - minipay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: minipay-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      - .env
    ports:
      - "${KEYCLOAK_HOST_PORT}:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - minipay-keycloak-data:/opt/keycloak/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  cache:
    image: redis:7-alpine
    container_name: minipay-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - minipay-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minipay-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MINIPAY_API_HOST_PORT}:8080"
    depends_on:
      payment_db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  minipay-postgres-data:
  minipay-keycloak-data:
  minipay-redis-data: